services:
  - type: web
    name: linkspace-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: linkspace-db
          property: connectionString

databases:
  - name: linkspace-db
    databaseName: linktree_db
    user: postgres
    plan: free
